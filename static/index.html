<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Customer Support AI Assistant</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F5F7FA;
      color: #1A202C;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1A202C;
    }

    .header-subtitle {
      font-size: 12px;
      color: #718096;
      margin-top: 2px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #718096;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #CBD5E0;
    }

    .status-dot.online {
      background: #38A169;
    }

    .status-dot.offline {
      background: #E53E3E;
    }

    .suggestions {
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
    }

    .suggestions button {
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      background: #E0E7FF;
      color: #4338CA;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .suggestions button:hover {
      background: #C7D2FE;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: #FFFFFF;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #F5F7FA;
    }

    .messages:empty::after {
      content: "👋 Welcome to Customer Support AI Assistant\A\A Ask questions about:\A • Orders\A • Refunds\A • Payments\A • Account Issues";
      white-space: pre-line;
      color: #A0AEC0;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.8;
      margin: auto;
    }

    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 0.94rem;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #4F46E5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: white;
      color: #1A202C;
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 4px;
      white-space: pre-wrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .msg.error {
      background: #FFF5F5;
      color: #C53030;
      border: 1px solid #FEB2B2;
    }

    .msg.ai.low-confidence {
      border-left: 3px solid #ED8936;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: white;
      border-top: 1px solid #E2E8F0;
    }

    .input-row textarea {
      flex: 1;
      resize: none;
      height: 46px;
      padding: 10px 14px;
      border: 1px solid #CBD5E0;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
    }

    .input-row textarea:focus {
      border-color: #4F46E5;
    }

    .input-row button {
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #4F46E5;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .input-row button:hover {
      background: #4338CA;
    }

    #clearBtn {
      background: #FFF5F5;
      color: #E53E3E;
      border: 1px solid #FEB2B2;
    }

    .sources-panel {
      width: 340px;
      background: white;
      border-left: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
    }

    .sources-header {
      padding: 14px 20px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #4F46E5;
      border-bottom: 1px solid #E2E8F0;
    }

    .sources-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #F5F7FA;
    }

    .sources-empty {
      color: #A0AEC0;
      text-align: center;
      margin: auto;
      line-height: 1.7;
    }

    .source-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .sc-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .sc-label {
      font-weight: 700;
      color: #4F46E5;
    }

    .sc-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .good {
      background: #C6F6D5;
      color: #276749;
    }

    .mid {
      background: #FEEBC8;
      color: #C05621;
    }

    .low {
      background: #FED7D7;
      color: #9B2C2C;
    }

    .sc-bar-wrap {
      height: 4px;
      background: #E2E8F0;
      border-radius: 2px;
      margin-bottom: 8px;
    }

    .sc-bar {
      height: 100%;
      background: #4F46E5;
      border-radius: 2px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E0;
      border-radius: 3px;
    }
  </style>
</head>

<body>

<header>
  <div>
    <div class="header-title">Customer Support AI Assistant</div>
    <div class="header-subtitle">
      Powered by RAG · Mistral · FAISS
    </div>
  </div>

  <div class="header-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>
</header>

<div class="suggestions">
  <button onclick="setQuestion('How can I reset my password?')">
    Reset Password
  </button>

  <button onclick="setQuestion('How do refunds work?')">
    Refund Policy
  </button>

  <button onclick="setQuestion('Where is my order?')">
    Track Order
  </button>
</div>

<div class="layout">

  <div class="chat-panel">

    <div class="messages" id="messages"></div>

    <div class="input-row">
      <textarea
        id="query"
        placeholder="Type your question..."
        rows="1"
      ></textarea>

      <button id="clearBtn">Clear</button>
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="sources-panel">
    <div class="sources-header">Retrieved Sources</div>

    <div class="sources-body" id="sourcesBody">
      <p class="sources-empty">
        Sources will appear here after your first query.
      </p>
    </div>
  </div>

</div>

<script>

const messagesEl = document.getElementById('messages');
const queryEl = document.getElementById('query');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const sourcesEl = document.getElementById('sourcesBody');

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let conversationHistory = [];

let savedMessages = localStorage.getItem('chatMessages');

if (savedMessages) {
  messagesEl.innerHTML = savedMessages;
}

async function checkHealth() {

  try {

    const res = await fetch('/health');

    if (res.ok) {
      statusDot.classList.add('online');
      statusText.textContent = 'System online';
    } else {
      throw new Error();
    }

  } catch {

    statusDot.classList.add('offline');
    statusText.textContent = 'System offline';
  }
}

checkHealth();

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendMsg(text, type) {

  const div = document.createElement('div');

  div.className = `msg ${type}`;

  const time = new Date().toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
  });

  div.innerHTML = `
    <div>${text}</div>

    <div style="
      font-size:11px;
      opacity:0.6;
      margin-top:6px;
      text-align:right;
    ">
      ${time}
    </div>
  `;

  messagesEl.appendChild(div);

  scrollToBottom();

  return div;
}

function renderMarkdown(text) {

  return text
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^- (.*$)/gim, '<li>$1</li>')
    .replace(/\n/g, '<br>');
}

function escHtml(str) {

  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderSources(sources) {

  sourcesEl.innerHTML = '';

  if (!sources || sources.length === 0) {

    sourcesEl.innerHTML = `
      <p class="sources-empty">
        No sources returned by this response.
      </p>
    `;

    return;
  }

  sources.forEach((s, i) => {

    const card = document.createElement('div');

    card.className = 'source-card';

    const scoreVal =
      typeof s.score === 'number' ? s.score : 0;

    const badgeClass =
      scoreVal >= 0.7 ? 'good' :
      scoreVal >= 0.4 ? 'mid' : 'low';

    const confidenceLabel =
      scoreVal >= 0.7
        ? '🟢 High Confidence'
        : scoreVal >= 0.4
        ? '🟡 Medium Confidence'
        : '🔴 Low Confidence';

    card.innerHTML = `
      <div class="sc-header">
        <span class="sc-label">
          Source ${i + 1}
        </span>

        <span class="sc-badge ${badgeClass}">
          ${confidenceLabel}
        </span>
      </div>

      <div class="sc-bar-wrap">
        <div
          class="sc-bar"
          style="width:${scoreVal * 100}%"
        ></div>
      </div>

      <div>
        <strong>Q:</strong>
        ${escHtml(s.query ?? '')}
      </div>

      <div style="margin-top:6px;">
        <strong>A:</strong>
        ${escHtml(s.answer ?? '')}
      </div>
    `;

    sourcesEl.appendChild(card);
  });
}

function setQuestion(question) {
  queryEl.value = question;
  queryEl.focus();
}

async function sendQuery() {

  const text = queryEl.value.trim();

  if (!text) return;

  queryEl.value = '';

  appendMsg(text, 'user');

  const thinking =
    appendMsg('🤖 AI is typing...', 'ai');

  sendBtn.disabled = true;

  try {

    const res = await fetch('/generate_response', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        user_query: text,
        history: conversationHistory
      })
    });

    if (!res.ok) {
      throw new Error();
    }

    const data = await res.json();

    const answer =
      data.response ?? 'No response generated';

    thinking.innerHTML = `
      ${renderMarkdown(answer)}

      <div style="
        font-size:11px;
        opacity:0.6;
        margin-top:6px;
        text-align:right;
      ">
        ${new Date().toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        })}
      </div>
    `;

    if (data.confidence === 'low') {

      thinking.classList.add('low-confidence');

      sourcesEl.innerHTML = `
        <p class="sources-empty"
          style="color:#ED8936;">
          ⚠️ No reliable sources found.
        </p>
      `;

    } else {

      renderSources(data.sources);
    }

    conversationHistory.push({
      role: 'user',
      content: text
    });

    conversationHistory.push({
      role: 'assistant',
      content: answer
    });

    localStorage.setItem(
      'chatMessages',
      messagesEl.innerHTML
    );

  } catch {

    thinking.className = 'msg error';

    thinking.textContent =
      '❌ Sorry, something went wrong. Please try again.';
  }

  sendBtn.disabled = false;

  queryEl.focus();

  scrollToBottom();
}

function clearChat() {

  conversationHistory = [];

  messagesEl.innerHTML = '';

  localStorage.removeItem('chatMessages');

  sourcesEl.innerHTML = `
    <p class="sources-empty">
      Sources will appear here after your first query.
    </p>
  `;
}

sendBtn.addEventListener('click', sendQuery);

clearBtn.addEventListener('click', clearChat);

queryEl.addEventListener('keydown', (e) => {

  if (e.key === 'Enter' && !e.shiftKey) {

    e.preventDefault();

    sendQuery();
  }
});

</script>

</body>
</html>
