<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG AI Support Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F5F7FA;
      color: #1A202C;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1A202C;
      letter-spacing: 0.01em;
    }

    .header-subtitle {
      font-size: 12px;
      color: #718096;
      margin-top: 2px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #718096;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #CBD5E0;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.online  { background: #38A169; }
    .status-dot.offline { background: #E53E3E; }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT: chat panel ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: #FFFFFF;
      border-right: 1px solid #E2E8F0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #F5F7FA;
    }

    .messages:empty::after {
      content: "Ask a question to get started.";
      color: #A0AEC0;
      font-size: 0.9rem;
      margin: auto;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.92rem;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #4F46E5;
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: #FFFFFF;
      color: #1A202C;
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 4px;
    }

    .msg.error {
      align-self: flex-start;
      background: #FFF5F5;
      color: #C53030;
      border: 1px solid #FEB2B2;
    }

    .msg.ai.low-confidence {
      border-left: 3px solid #ED8936;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
    }

    .input-row textarea {
      flex: 1;
      resize: none;
      height: 44px;
      padding: 10px 14px;
      background: #FFFFFF;
      border: 1px solid #CBD5E0;
      border-radius: 8px;
      color: #1A202C;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.4;
      overflow: hidden;
    }

    .input-row textarea:focus { border-color: #4F46E5; }
    .input-row textarea::placeholder { color: #A0AEC0; }

    .input-row button {
      padding: 0 20px;
      background: #4F46E5;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .input-row button:hover:not(:disabled) { background: #4338CA; }
    .input-row button:disabled { background: #E2E8F0; color: #A0AEC0; cursor: not-allowed; }

    #clearBtn {
      background: #FFF5F5;
      color: #E53E3E;
      border: 1px solid #FEB2B2;
      padding: 0 14px;
    }
    #clearBtn:hover { background: #FED7D7; }

    /* ── RIGHT: sources panel ── */
    .sources-panel {
      width: 340px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #FFFFFF;
      border-left: 1px solid #E2E8F0;
    }

    .sources-header {
      padding: 14px 20px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4F46E5;
      border-bottom: 1px solid #E2E8F0;
      background: #FFFFFF;
    }

    .sources-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #F5F7FA;
    }

    .sources-empty {
      color: #A0AEC0;
      font-size: 0.88rem;
      margin: auto;
      text-align: center;
      line-height: 1.6;
    }

    .source-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .sc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .sc-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #4F46E5;
    }

    .sc-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
    }

    .sc-badge.good { background: #C6F6D5; color: #276749; }
    .sc-badge.mid  { background: #FEEBC8; color: #C05621; }
    .sc-badge.low  { background: #FED7D7; color: #9B2C2C; }

    .sc-bar-wrap {
      height: 4px;
      background: #E2E8F0;
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .sc-bar {
      height: 100%;
      background: #4F46E5;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .source-card .sq {
      color: #718096;
      margin-bottom: 4px;
    }

    .source-card .sq span { color: #4F46E5; }

    .source-card .sa { color: #718096; }
    .source-card .sa span { color: #4A5568; }

    /* scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E0; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-title">RAG AI Support Assistant</div>
    <div class="header-subtitle">Powered by RAG &middot; Mistral &middot; FAISS</div>
  </div>
  <div class="header-status" id="statusIndicator">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Checking…</span>
  </div>
</header>

<div class="layout">

  <!-- LEFT: chat -->
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <textarea id="query" placeholder="Type your question…" rows="1"></textarea>
      <button id="clearBtn">Clear Chat</button>
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- RIGHT: sources -->
  <div class="sources-panel">
    <div class="sources-header">Retrieved Sources</div>
    <div class="sources-body" id="sourcesBody">
      <p class="sources-empty">Sources will appear here<br>after your first query.</p>
    </div>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const queryEl    = document.getElementById('query');
  const sendBtn    = document.getElementById('sendBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const sourcesEl  = document.getElementById('sourcesBody');
  const statusDot  = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let conversationHistory = [];

  // ── Health check on load ──────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const res = await fetch('/health');
      if (res.ok) {
        statusDot.classList.add('online');
        statusText.textContent = 'System online';
      } else {
        throw new Error();
      }
    } catch {
      statusDot.classList.add('offline');
      statusText.textContent = 'System offline';
    }
  }
  checkHealth();

  // ── Helpers ───────────────────────────────────────────────────────────────
  function appendMsg(text, type) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderSources(sources) {
    sourcesEl.innerHTML = '';
    if (!sources || sources.length === 0) {
      sourcesEl.innerHTML = '<p class="sources-empty">No sources returned<br>by this response.</p>';
      return;
    }
    sources.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'source-card';
      const scoreVal = typeof s.score === 'number' ? s.score : 0;
      const scorePct = (scoreVal * 100).toFixed(1);
      const badgeClass = scoreVal >= 0.7 ? 'good' : scoreVal >= 0.4 ? 'mid' : 'low';
      const answerText = escHtml(s.answer ?? '');
      const answerTrunc = answerText.length > 150 ? answerText.slice(0, 150) + '…' : answerText;
      card.innerHTML = `
        <div class="sc-header">
          <span class="sc-label">Source ${i + 1}</span>
          <span class="sc-badge ${badgeClass}">Match: ${scorePct}%</span>
        </div>
        <div class="sc-bar-wrap"><div class="sc-bar" style="width:${Math.min(scoreVal * 100, 100).toFixed(1)}%"></div></div>
        <div class="sq">Q: <span>${escHtml(s.query ?? '')}</span></div>
        <div class="sa">A: <span>${answerTrunc}</span></div>
      `;
      sourcesEl.appendChild(card);
    });
  }

  // ── Send query ────────────────────────────────────────────────────────────
  async function sendQuery() {
    const text = queryEl.value.trim();
    if (!text) return;

    queryEl.value = '';
    queryEl.style.height = '44px';
    sendBtn.disabled = true;

    appendMsg(text, 'user');
    const thinking = appendMsg('…', 'ai');

    try {
      const res = await fetch('/generate_response', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_query: text, history: conversationHistory })
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const data = await res.json();
      const answer = data.response ?? '(empty response)';
      thinking.innerHTML = renderMarkdown(answer);

      if (data.confidence === 'low') {
        thinking.classList.add('low-confidence');
        sourcesEl.innerHTML = '<p class="sources-empty" style="color:#ED8936;">⚠️ No reliable sources found. This question may be outside the support domain.</p>';
      } else {
        renderSources(data.sources);
      }

      conversationHistory.push({ role: 'user',      content: text });
      conversationHistory.push({ role: 'assistant', content: answer });
    } catch (err) {
      thinking.className = 'msg error';
      thinking.textContent = `Error: ${err.message}`;
      sourcesEl.innerHTML = '<p class="sources-empty">No sources available.</p>';
    } finally {
      sendBtn.disabled = false;
      queryEl.focus();
    }
  }

  // ── Clear chat ────────────────────────────────────────────────────────────
  function clearChat() {
    conversationHistory = [];
    messagesEl.innerHTML = '';
    sourcesEl.innerHTML = '<p class="sources-empty">Sources will appear here<br>after your first query.</p>';
    queryEl.focus();
  }

  sendBtn.addEventListener('click', sendQuery);
  clearBtn.addEventListener('click', clearChat);

  queryEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  });
</script>
</body>
</html>
